<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b2b"><title>MY GOLF GPS</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#edf4ee;color:#123b2b;margin:0;padding:20px}main{max-width:520px;margin:auto}h1{margin-bottom:3px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 10px #1232}button{background:#126e4b;color:white;border:0;border-radius:12px;padding:15px;width:100%;font-size:17px;font-weight:700;margin:6px 0}button.secondary{background:#dbe9df;color:#123b2b}input{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 10px;border:1px solid #abb;border-radius:9px;font-size:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{text-align:center}.big{font-size:29px;font-weight:800}small{color:#52665a}#status{white-space:pre-line;line-height:1.5}</style></head><body><main><h1>⛳ MY GOLF GPS</h1><small>아이폰 GPS 샷 거리 · 그린 잔여 거리</small><div class="card"><label>골프장 / 코스 / 홀</label><input id="course" placeholder="예: 노벨CC 레이크 1홀"><label>그린 중앙 위도</label><input id="lat" type="number" step="any" placeholder="예: 35.123456"><label>그린 중앙 경도</label><input id="lon" type="number" step="any" placeholder="예: 128.123456"><button class="secondary" id="setGreen">현재 위치를 그린으로 등록</button><button id="save">그린 좌표 저장</button><small>그린에 직접 가서 등록하거나 지도 등에서 확인한 좌표를 입력하세요.</small></div><div class="stats"><div class="card"><small>이번 샷 거리</small><div class="big" id="shot">—</div></div><div class="card"><small>그린까지 남은 거리</small><div class="big" id="remain">—</div></div></div><div class="card"><button id="start">① 샷 시작 위치 저장</button><button id="ball">② 공 위치 저장 · 거리 계산</button><button class="secondary" id="refresh">현재 위치 · 잔여 거리 갱신</button><p id="status">위치 권한을 허용하고 그린 좌표를 등록하세요.</p><small>GPS 위치 오차가 있을 수 있습니다. 샷 거리는 캐리가 아닌 두 위치 사이 직선거리입니다. HTTPS 접속이 필요합니다.</small></div></main><script>
const $=id=>document.getElementById(id);let start=null,green=null;const key=()=>`golfgreen:${$('course').value.trim()}`;function rad(d){return d*Math.PI/180}function distance(a,b){let R=6371000,dlat=rad(b.lat-a.lat),dlon=rad(b.lon-a.lon),x=Math.sin(dlat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function msg(t){$('status').textContent=t}function locate(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('이 브라우저에서 GPS를 지원하지 않습니다.'));navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),e=>no(new Error('GPS 오류: '+e.message)),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}function getGreen(){let lat=Number($('lat').value),lon=Number($('lon').value);if(!$('lat').value||!$('lon').value||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('그린 위도·경도를 정확히 입력하세요.');return {lat,lon}}function display(pos){if(green)$('remain').textContent=Math.round(distance(pos,green))+' m'}async function run(fn){try{msg('GPS 위치 확인 중…');await fn()}catch(e){msg(e.message)}}$('save').onclick=()=>run(async()=>{green=getGreen();if(!$('course').value.trim())throw Error('골프장/홀 이름을 입력하세요.');localStorage.setItem(key(),JSON.stringify(green));msg('그린 좌표 저장 완료')});$('setGreen').onclick=()=>run(async()=>{let p=await locate();$('lat').value=p.lat.toFixed(7);$('lon').value=p.lon.toFixed(7);msg('현재 위치를 입력했습니다. 정확도 ±'+Math.round(p.accuracy)+'m. 저장 버튼을 누르세요.')});$('start').onclick=()=>run(async()=>{start=await locate();display(start);$('shot').textContent='—';msg('샷 시작 위치 저장 완료 · GPS 정확도 ±'+Math.round(start.accuracy)+'m\n공을 친 뒤 공 위치에서 ② 버튼을 누르세요.')});$('ball').onclick=()=>run(async()=>{if(!start)throw Error('먼저 ① 샷 시작 위치를 저장하세요.');let p=await locate();$('shot').textContent=Math.round(distance(start,p))+' m';display(p);msg('샷 거리 계산 완료 · GPS 정확도 ±'+Math.round(p.accuracy)+'m\n다음 샷은 ① 버튼으로 시작하세요.')});$('refresh').onclick=()=>run(async()=>{let p=await locate();display(p);msg('현재 위치 갱신 · GPS 정확도 ±'+Math.round(p.accuracy)+'m')});$('course').onchange=()=>{let v=localStorage.getItem(key());if(v){let g=JSON.parse(v);$('lat').value=g.lat;$('lon').value=g.lon;green=g;msg('저장된 그린 좌표 불러옴')}};
</script></body></html>
